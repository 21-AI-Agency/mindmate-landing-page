name: Deploy to S3/CloudFront

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: mindmate-landing-page
  CLOUDFRONT_DISTRIBUTION_ID: E1C2A12X43ZVPC
  AWS_ROLE_ARN: arn:aws:iam::654404853357:role/mindmate-landing-page-github-actions-role

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync . s3://$S3_BUCKET/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "ansible/*" \
            --exclude "*.bak" \
            --exclude "README.md" \
            --exclude "LICENCE" \
            --exclude ".gitignore" \
            --exclude ".idea/*" \
            --exclude "CLAUDE.md" \
            --exclude "SEO_SETUP.md" \
            --exclude "TestCommit" \
            --exclude "firebase-debug.log" \
            --exclude ".claude/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
